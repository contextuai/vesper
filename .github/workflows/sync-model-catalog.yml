name: Sync Living Model Catalog

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  push:
    branches:
      - main
    paths:
      - "catalog/models.json"
      - "backend/scripts/sync_catalog_json.py"
      - ".github/workflows/sync-model-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-catalog"
  cancel-in-progress: false

jobs:
  build-catalog:
    name: Build Living Model Catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx
        run: pip install httpx

      - name: Build GitHub Pages catalog bundle
        run: |
          python backend/scripts/sync_catalog_json.py \
            --base catalog/models.json \
            --site-dir _site \
            --live-url "https://contextuai.github.io/vesper/models.json" \
            --max-trending 25

      - name: Validate generated catalog bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          site_dir = Path("_site")
          manifest_path = site_dir / "models.json"
          index_path = site_dir / "index.html"
          nojekyll_path = site_dir / ".nojekyll"

          assert manifest_path.is_file(), "Missing _site/models.json"
          assert index_path.is_file(), "Missing _site/index.html"
          assert nojekyll_path.is_file(), "Missing _site/.nojekyll"

          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          models = data.get("models")
          assert isinstance(models, list) and len(models) > 0, "Empty models list"

          for model in models:
              for field in ("id", "name", "hf_repo", "hf_filename"):
                  assert model.get(field), "Missing required field: " + field
              assert float(model.get("size_gb") or 0) > 0, "Invalid size_gb for " + str(model.get("id"))

          print("Validated catalog models:", len(models))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy-catalog:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-catalog
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
